name: Build Windows ASI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build x64 Release
        shell: cmd
        run: call build.bat

      - name: Upload plugin and settings
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tekken8FpsUnlocker-win64
          path: |
            Tekken8FpsUnlocker.asi
            Tekken8FpsUnlocker.ini
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach the build to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          archive=Tekken8FpsUnlocker-win64.zip
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"
          unzip -tq "$archive"
          if attached=$(gh release view "$TAG" --json assets --jq 'any(.assets[]; .name == "Tekken8FpsUnlocker-win64.zip")'); then
            if [[ "$attached" == false ]]; then
              gh release upload "$TAG" "$archive"
            fi
          else
            gh release create "$TAG" "$archive" --verify-tag --title "$TAG" --generate-notes
          fi
