name: Build Windows ASI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Windows Server 2025 with Visual Studio 2026 and CMake 4.
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write          # Request the Sigstore signing certificate
      attestations: write      # Store the attestation
      artifact-metadata: write # Record the attested artifact
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build x64 Release
        shell: cmd
        run: call build.bat

      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      # Pull requests only check the build. Builds from main are signed.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: Tekken8FpsUnlocker.asi

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: Tekken8FpsUnlocker-win64
          path: |
            Tekken8FpsUnlocker.asi
            Tekken8FpsUnlocker.ini
          if-no-files-found: error
